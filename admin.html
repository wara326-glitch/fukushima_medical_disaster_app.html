<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理者ページ｜福島県医師会 災害時医療情報伝達アプリ</title>
<style>
:root{--blue:#2563eb;--bg:#f4f7fb;--text:#172033;--muted:#64748b;--line:#dbe3ee;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#10314f,#1d5b8f);color:#fff;padding:16px}header h1{font-size:20px;margin:0}header p{font-size:12px;margin:5px 0 0;opacity:.9}
main{max-width:1280px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px #1e293b0a;margin-bottom:14px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}button.secondary{background:#e2e8f0;color:#1e293b}
input,select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:220px}.hidden{display:none}.small{font-size:12px;color:var(--muted)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.admin-table{border-collapse:collapse;width:100%;min-width:1500px;font-size:13px}.admin-table th,.admin-table td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;white-space:nowrap}.admin-table th{background:#eef4fa}
.bad{color:var(--red);font-weight:700}.warn{color:var(--amber);font-weight:700}.support-urgent{background:#fee2e2;color:#991b1b;font-weight:800}.support-needed{background:#fef3c7;color:#92400e;font-weight:800}.alert-purple{background:#f3e8ff;color:#6b21a8;font-weight:800}.alert-red{background:#fee2e2;color:#991b1b;font-weight:800}.alert-yellow{background:#fef3c7;color:#92400e;font-weight:800}.status{margin-top:10px;font-size:13px}.login{max-width:480px;margin:45px auto}
.editbtn{padding:6px 10px;font-size:12px;white-space:nowrap}.deletebtn{padding:6px 10px;font-size:12px;white-space:nowrap;background:var(--red);margin-left:5px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:24px;z-index:1000;overflow:auto}.modal.hidden{display:none}.modalbox{background:#fff;width:min(1100px,100%);border-radius:16px;padding:18px;box-shadow:0 20px 60px #0004}.editgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}.editfield label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.editfield input,.editfield textarea,.editfield select{width:100%}.editfield textarea{min-height:72px;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.edittabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:8px}.edittab{background:#e2e8f0;color:#334155;padding:8px 12px}.edittab.active{background:var(--blue);color:#fff}.editsectiontitle{grid-column:1/-1;font-size:14px;font-weight:800;margin-top:4px;padding:8px 0;border-bottom:1px solid var(--line)}@media(max-width:720px){.editgrid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>福島県医師会 災害時医療情報 管理者ページ</h1><p>医療機関別一覧・検索・絞り込み・CSV出力</p></header>
<main>
<section id="loginView" class="card login">
<h2>管理者ログイン</h2>
<p class="small">許可された管理者のGoogleアカウントでログインしてください。</p>
<div style="margin-top:14px"><button id="googleLoginBtn">Googleでログイン</button></div>
<div id="loginStatus" class="status bad"></div>
</section>
<section id="dashView" class="hidden">
<div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">回答一覧</h2><div class="small">①安否確認／②緊急時入力／③詳細入力を一覧表示します。</div></div><div><button id="csvBtn">CSV出力</button> <button id="logoutBtn" class="secondary">ログアウト</button></div></div>
<div class="row" style="margin-top:14px"><input id="search" class="grow" placeholder="医療機関名・市町村で検索"><select id="typeFilter"><option value="">報告区分：すべて</option><option value="safety">①安否確認</option><option value="emergency">②緊急時入力</option><option value="detail">③詳細入力</option></select><select id="supportFilter"><option value="">支援：すべて</option><option value="needed">支援必要</option><option value="urgent">緊急</option></select></div>
<div id="summary" class="small" style="margin-top:10px"></div></div>
<div class="card"><div id="tableTitle" style="font-weight:800;margin-bottom:10px"></div><div class="tablewrap"><table class="admin-table"><thead><tr id="tableHead"></tr></thead><tbody id="rows"></tbody></table></div></div>
</section>
<div id="editModal" class="modal hidden">
  <div class="modalbox">
    <div class="row" style="justify-content:space-between">
      <div><h2 style="margin:0">回答データ編集</h2><div class="small">保存すると、この端末内の回答データが更新されます。</div></div>
      <button id="editClose" class="secondary">閉じる</button>
    </div>
    <div class="edittabs">
<button type="button" class="edittab active" data-edit-tab="basic">基本情報</button>
<button type="button" class="edittab" data-edit-tab="safety">① 安否確認</button>
<button type="button" class="edittab" data-edit-tab="emergency">② 緊急時入力</button>
<button type="button" class="edittab" data-edit-tab="detail">③ 詳細入力</button>
</div>
<div id="editFields" class="editgrid" style="margin-top:14px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button id="editCancel" class="secondary">キャンセル</button>
      <button id="editSave">変更を保存</button>
    </div>
    <div id="editStatus" class="status"></div>
  </div>
</div>
</main>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {getFirestore,collection,query,orderBy,getDocs,doc,getDoc,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const $=id=>document.getElementById(id), app=initializeApp(window.FMA_FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);
let cache=[],profile=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const typeLabel={safety:'①安否確認',emergency:'②緊急時入力',detail:'③詳細入力'};
async function loadProfile(u){const x=await getDoc(doc(db,'admin_profiles',u.uid));return x.exists()?x.data():null}
async function loadReports(){const snap=await getDocs(query(collection(db,'reports'),orderBy('createdAt','desc')));cache=snap.docs.map(d=>({id:d.id,...d.data()}));render()}
function refresh(){const ok=!!profile;$('loginView').classList.toggle('hidden',ok);$('dashView').classList.toggle('hidden',!ok)}
$('googleLoginBtn').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('loginStatus').textContent='ログインできませんでした：'+e.message);
$('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{profile=null;refresh();if(!u)return;try{profile=await loadProfile(u);if(!profile||profile.enabled!==true){$('loginStatus').textContent='このGoogleアカウントには管理者権限がありません。';await signOut(auth);return}refresh();await loadReports()}catch(e){$('loginStatus').textContent='権限確認に失敗しました：'+e.message}});
function filtered(){const q=$('search').value.trim().toLowerCase(),t=$('typeFilter').value,s=$('supportFilter').value;return cache.filter(r=>{const hit=!q||(String(r.facility||'')+' '+String(r.municipality||'')).toLowerCase().includes(q),typeOk=!t||r.type===t,urgent=r.supportNeeded==='緊急'||r.emergencySupport==='緊急に要',needed=urgent||r.supportNeeded==='あり'||r.emergencySupport==='要'||String(r.emergencyNote||r.detailNote||'').trim();return hit&&typeOk&&(!s||(s==='urgent'?urgent:needed))})}
const keys=['reportedAt','facility','municipality','facilityType','type','reporter','phone','emisStatus','seismic','staffSafety','facilityDamage','careStatus','supportNeeded','safetyNote','building','buildingRisk','power','water','gas','comms','careEmergency','emergencyAccept','inpatientImpact','transferNeed','staffShort','supplyShort','emergencySupport','transportSupport','emergencyNote','detailDamage','flood','fire','gridPower','generator','fuelHours','detailWater','tank','fixedPhone','internet','outpatient','er','ward','surgery','icu','dialysis','delivery','homecare','pharmacy','oxygen','inpatients','transferCount','newAccept','criticalAccept','doctorShort','nurseShort','supplies','detailNote'];
function render(){const a=filtered();$('summary').textContent='全報告 '+cache.length+'件 ／ 表示 '+a.length+'件 ／ 緊急支援 '+cache.filter(r=>r.supportNeeded==='緊急'||r.emergencySupport==='緊急に要').length+'件';$('tableTitle').textContent='回答一覧';$('tableHead').innerHTML='<th>操作</th>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('');$('rows').innerHTML=a.map(r=>'<tr><td>'+(profile.role!=='viewer'?'<button class="editbtn" data-edit="'+r.id+'">編集</button> ':'')+(profile.role==='admin'?'<button class="deletebtn" data-del="'+r.id+'">消去</button>':'')+'</td>'+keys.map(k=>'<td>'+esc(k==='type'?(typeLabel[r[k]]||r[k]):r[k])+'</td>').join('')+'</tr>').join('')||'<tr><td>該当する回答はありません。</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeReport(b.dataset.del))}
['search','typeFilter','supportFilter'].forEach(id=>$(id).addEventListener('input',render));
$('csvBtn').onclick=()=>{const a=filtered(),e=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv='\ufeff'+keys.map(e).join(',')+'\n'+a.map(r=>keys.map(k=>e(r[k])).join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),x=document.createElement('a');x.href=url;x.download='fukushima_medical_disaster_'+new Date().toISOString().slice(0,10)+'.csv';x.click();URL.revokeObjectURL(url)};
let editingId=null;
function openEdit(id){if(!['editor','admin'].includes(profile.role))return;const r=cache.find(x=>x.id===id);if(!r)return;editingId=id;$('editFields').innerHTML=keys.filter(k=>k!=='type').map(k=>'<div class="editfield"><label>'+esc(k)+'</label><input data-key="'+k+'" value="'+esc(r[k]??'')+'"></div>').join('');$('editModal').classList.remove('hidden')}
function closeEdit(){$('editModal').classList.add('hidden');editingId=null}
$('editClose').onclick=closeEdit;$('editCancel').onclick=closeEdit;
$('editSave').onclick=async()=>{if(!editingId)return;const patch={updatedAt:serverTimestamp()};$('editFields').querySelectorAll('[data-key]').forEach(x=>patch[x.dataset.key]=x.value);await updateDoc(doc(db,'reports',editingId),patch);closeEdit();await loadReports()};
async function removeReport(id){if(profile.role!=='admin'||!confirm('この回答を削除します。元に戻せません。'))return;await deleteDoc(doc(db,'reports',id));await loadReports()}
</script></body></html>

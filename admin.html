<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理者ページ｜福島県医師会 災害時医療情報伝達アプリ</title>
<style>
:root{--blue:#2563eb;--bg:#f4f7fb;--text:#172033;--muted:#64748b;--line:#dbe3ee;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#10314f,#1d5b8f);color:#fff;padding:16px}header h1{font-size:20px;margin:0}header p{font-size:12px;margin:5px 0 0;opacity:.9}
main{max-width:1280px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px #1e293b0a;margin-bottom:14px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}button.secondary{background:#e2e8f0;color:#1e293b}
input,select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:220px}.hidden{display:none}.small{font-size:12px;color:var(--muted)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.admin-table{border-collapse:collapse;width:100%;min-width:1500px;font-size:13px}.admin-table th,.admin-table td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;white-space:nowrap}.admin-table th{background:#eef4fa}
.bad{color:var(--red);font-weight:700}.warn{color:var(--amber);font-weight:700}.support-urgent{background:#fee2e2;color:#991b1b;font-weight:800}.support-needed{background:#fef3c7;color:#92400e;font-weight:800}.alert-purple{background:#f3e8ff;color:#6b21a8;font-weight:800}.alert-red{background:#fee2e2;color:#991b1b;font-weight:800}.alert-yellow{background:#fef3c7;color:#92400e;font-weight:800}.status{margin-top:10px;font-size:13px}.login{max-width:480px;margin:45px auto}
.editbtn{padding:6px 10px;font-size:12px;white-space:nowrap}.deletebtn{padding:6px 10px;font-size:12px;white-space:nowrap;background:var(--red);margin-left:5px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:24px;z-index:1000;overflow:auto}.modal.hidden{display:none}.modalbox{background:#fff;width:min(1100px,100%);border-radius:16px;padding:18px;box-shadow:0 20px 60px #0004}.editgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}.editfield label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.editfield input,.editfield textarea,.editfield select{width:100%}.editfield textarea{min-height:72px;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.edittabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:8px}.edittab{background:#e2e8f0;color:#334155;padding:8px 12px}.edittab.active{background:var(--blue);color:#fff}.editsectiontitle{grid-column:1/-1;font-size:14px;font-weight:800;margin-top:4px;padding:8px 0;border-bottom:1px solid var(--line)}@media(max-width:720px){.editgrid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>福島県医師会 災害時医療情報 管理者ページ</h1><p>医療機関別一覧・検索・絞り込み・CSV出力</p></header>
<main>
<section id="loginView" class="card login">
<h2>管理者ログイン</h2><p class="small" id="setupText">Supabase Authに登録された管理者アカウントでログインしてください。</p>
<label>メールアドレス</label><input id="adminId" class="grow" type="email" autocomplete="username">
<label style="display:block;margin-top:10px">パスワード</label><input id="adminPw" class="grow" type="password" autocomplete="current-password">
<div style="margin-top:14px"><button id="loginBtn">ログイン</button></div>
<div id="mfaView" class="hidden"><label style="display:block;margin-top:14px">認証アプリの6桁コード</label><input id="mfaCode" class="grow" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><div style="margin-top:14px"><button id="mfaBtn">確認する</button></div></div>
<div id="loginStatus" class="status bad" role="status" aria-live="polite"></div>
</section>
<section id="dashView" class="hidden">
<div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">回答一覧</h2><div class="small">①安否確認／②緊急時入力／③詳細入力を一覧表示します。</div></div><div><button id="csvBtn">CSV出力</button> <button id="logoutBtn" class="secondary">ログアウト</button></div></div>
<div class="row" style="margin-top:14px"><input id="search" class="grow" placeholder="医療機関名・市町村で検索"><select id="typeFilter"><option value="">報告区分：すべて</option><option value="safety">①安否確認</option><option value="emergency">②緊急時入力</option><option value="detail">③詳細入力</option></select><select id="supportFilter"><option value="">支援：すべて</option><option value="needed">支援必要</option><option value="urgent">緊急</option></select></div>
<div id="summary" class="small" style="margin-top:10px"></div></div>
<div class="card"><div id="tableTitle" style="font-weight:800;margin-bottom:10px"></div><div class="tablewrap"><table class="admin-table"><thead><tr id="tableHead"></tr></thead><tbody id="rows"></tbody></table></div></div>
</section>
<div id="editModal" class="modal hidden">
  <div class="modalbox">
    <div class="row" style="justify-content:space-between">
      <div><h2 style="margin:0">回答データ編集</h2><div class="small">保存すると、災害医療データベースの回答が更新されます。</div></div>
      <button id="editClose" class="secondary">閉じる</button>
    </div>
    <div class="edittabs">
<button type="button" class="edittab active" data-edit-tab="basic">基本情報</button>
<button type="button" class="edittab" data-edit-tab="safety">① 安否確認</button>
<button type="button" class="edittab" data-edit-tab="emergency">② 緊急時入力</button>
<button type="button" class="edittab" data-edit-tab="detail">③ 詳細入力</button>
</div>
<div id="editFields" class="editgrid" style="margin-top:14px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button id="editCancel" class="secondary">キャンセル</button>
      <button id="editSave">変更を保存</button>
    </div>
    <div id="editStatus" class="status"></div>
  </div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-config.js"></script>
<script>
const $=id=>document.getElementById(id);
const config=window.FMA_APP_CONFIG||{};
const db=config.supabaseUrl&&config.supabasePublishableKey?supabase.createClient(config.supabaseUrl,config.supabasePublishableKey):null;
let reportRows=[];let mfaFactor=null;
function reports(){return reportRows}
function setLoginStatus(message){$('loginStatus').textContent=message}
function setAuthView(ok){$('loginView').classList.toggle('hidden',ok);$('dashView').classList.toggle('hidden',!ok)}
function fromDb(row){return {id:row.id,type:row.report_type,facility:row.facility,facilityType:row.facility_type,municipality:row.municipality,reporter:row.reporter,phone:row.phone,reportedAt:row.reported_at||'',createdAt:row.created_at,updatedAt:row.updated_at,...(row.payload||{})}}
async function loadReports(){
 if(!db)return;
 $('summary').textContent='回答を読み込んでいます…';
 const {data,error}=await db.from('medical_reports').select('*').order('created_at',{ascending:false});
 if(error){$('summary').textContent='回答を取得できません：'+error.message;return}
 reportRows=(data||[]).map(fromDb);render();
}
async function completeLogin(){
 const {data:level}=await db.auth.mfa.getAuthenticatorAssuranceLevel();
 if(level?.nextLevel==='aal2'&&level.currentLevel!=='aal2'){
   const {data}=await db.auth.mfa.listFactors();mfaFactor=(data?.totp||[]).find(f=>f.status==='verified');
   if(!mfaFactor){await db.auth.signOut();setLoginStatus('この管理者アカウントには多要素認証が登録されていません。SupabaseでMFAを設定してください。');return}
   $('mfaView').classList.remove('hidden');setLoginStatus('認証アプリのコードを入力してください。');return;
 }
 $('mfaView').classList.add('hidden');setLoginStatus('');setAuthView(true);await loadReports();
}
$('loginBtn').onclick=async()=>{
 if(!db){setLoginStatus('Supabase接続設定が見つかりません。');return}
 const email=$('adminId').value.trim(),password=$('adminPw').value;if(!email||!password){setLoginStatus('メールアドレスとパスワードを入力してください。');return}
 setLoginStatus('ログインしています…');const {error}=await db.auth.signInWithPassword({email,password});
 if(error){setLoginStatus('ログインできません：'+error.message);return}$('adminPw').value='';await completeLogin();
}
$('mfaBtn').onclick=async()=>{
 const code=$('mfaCode').value.trim();if(!mfaFactor||!/^[0-9]{6}$/.test(code)){setLoginStatus('6桁の認証コードを入力してください。');return}
 const {data:challenge,error:challengeError}=await db.auth.mfa.challenge({factorId:mfaFactor.id});
 if(challengeError){setLoginStatus('認証を開始できません：'+challengeError.message);return}
 const {error}=await db.auth.mfa.verify({factorId:mfaFactor.id,challengeId:challenge.id,code});
 if(error){setLoginStatus('認証コードを確認できません：'+error.message);return}await completeLogin();
}
$('logoutBtn').onclick=async()=>{if(db)await db.auth.signOut();reportRows=[];setAuthView(false)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function filtered(){const q=$('search').value.trim().toLowerCase(),t=$('typeFilter').value,s=$('supportFilter').value;return reports().filter(r=>{const hit=!q||(String(r.facility||'')+' '+String(r.municipality||'')).toLowerCase().includes(q);const typeOk=!t||r.type===t;const urgent=r.supportNeeded==='緊急'||r.emergencySupport==='緊急に要';const needed=urgent||r.supportNeeded==='あり'||r.emergencySupport==='要'||String(r.emergencyNote||r.detailNote||'').trim()!=='';return hit&&typeOk&&(!s||(s==='urgent'?urgent:needed))})}
const commonCols=[
 ['reportedAt','報告時刻'],['facility','医療機関名'],['municipality','市町村'],['facilityType','区分'],['reporter','回答者'],['phone','連絡先'],['emisStatus','EMIS状況'],['seismic','震度']
];
const typeCols={
 safety:[['staffSafety','職員の安否'],['facilityDamage','医療機関の被害'],['careStatus','診療状況'],['supportNeeded','支援要請'],['safetyNote','第1報・備考']],
 emergency:[['building','建物・施設被害'],['buildingRisk','建物の危険状況'],['power','電気'],['water','水道'],['gas','医療ガス'],['comms','通信'],['careEmergency','現在の診療可否'],['emergencyAccept','救急患者受入'],['inpatientImpact','入院患者への影響'],['transferNeed','転院が必要な患者'],['staffShort','人員不足'],['supplyShort','医薬品・医療資機材不足'],['emergencySupport','支援要否'],['transportSupport','患者搬送支援'],['emergencyNote','必要な支援内容']],
 detail:[['detailDamage','倒壊・損壊'],['flood','浸水'],['fire','火災'],['gridPower','商用電源'],['generator','非常用発電機'],['fuelHours','燃料残り時間（時間）'],['detailWater','上水'],['tank','受水槽'],['fixedPhone','固定電話'],['internet','インターネット'],['outpatient','外来'],['er','救急'],['ward','入院'],['surgery','手術'],['icu','ICU/HCU'],['dialysis','人工透析'],['delivery','分娩'],['homecare','在宅医療'],['pharmacy','処方・薬剤提供'],['oxygen','酸素・医療ガス供給'],['inpatients','現在の入院患者数'],['transferCount','転院必要患者数'],['newAccept','新規患者受入'],['criticalAccept','重症患者受入'],['doctorShort','医師不足'],['nurseShort','看護師不足'],['supplies','不足している医薬品・物資・資機材'],['detailNote','必要な支援内容・その他詳細']]
};
const typeLabel={safety:'①安否確認',emergency:'②緊急時入力',detail:'③詳細入力'};
function valueText(v){return v===undefined||v===null?'':String(v)}
function cellHtml(r,k){
 const v=valueText(r[k]);let cls='';
 if(r.type==='safety'&&k==='supportNeeded') cls=v==='緊急'?'support-urgent':v==='あり'?'support-needed':'';
 if(r.type==='emergency'){
   if(k==='building') cls=v==='使用不能'?'alert-purple':v==='重大な被害'?'alert-red':v==='一部被害'?'alert-yellow':'';
   if(k==='buildingRisk'&&v==='危険あり') cls='alert-red';
   if(k==='power'&&v==='停電') cls='alert-red';
   if(k==='water'&&v==='断水') cls='alert-red';
 }
 return '<td'+(cls?' class="'+cls+'"':'')+'>'+esc(v)+'</td>';
}
function actionButtons(id){const q=JSON.stringify(String(id));return '<button class="editbtn" onclick=\'openEdit('+q+')\'>編集</button><button class="deletebtn" onclick=\'deleteReport('+q+')\'>消去</button>'}
function render(){
 const all=reports(),a=filtered(),selected=$('typeFilter').value;
 $('summary').textContent='全報告 '+all.length+'件 ／ 表示 '+a.length+'件 ／ 緊急支援 '+all.filter(r=>r.supportNeeded==='緊急'||r.emergencySupport==='緊急に要').length+'件';
 if(selected){
   const cols=commonCols.concat(typeCols[selected]||[]);
   $('tableTitle').textContent=typeLabel[selected]+' の回答';
   $('tableHead').innerHTML='<th>操作</th>'+cols.map(([,label])=>'<th>'+esc(label)+'</th>').join('');
   $('rows').innerHTML=a.map(r=>'<tr><td>'+actionButtons(r.id)+'</td>'+cols.map(([k])=>cellHtml(r,k)).join('')+'</tr>').join('')||'<tr><td colspan="'+(cols.length+1)+'">該当する回答はありません。</td></tr>';
 }else{
   $('tableTitle').textContent='①・②・③ 回答一覧（回答内容は項目ごとに横並び表示）';
   const allTypeCols=[
     ...typeCols.safety.map(x=>['safety',...x]),
     ...typeCols.emergency.map(x=>['emergency',...x]),
     ...typeCols.detail.map(x=>['detail',...x])
   ];
   $('tableHead').innerHTML='<th>操作</th><th>報告区分</th>'+commonCols.map(([,label])=>'<th>'+esc(label)+'</th>').join('')+
     allTypeCols.map(([t,k,label])=>'<th>'+esc(typeLabel[t]+'｜'+label)+'</th>').join('');
   $('rows').innerHTML=a.map(r=>{
     return '<tr><td>'+actionButtons(r.id)+'</td><td>'+esc(typeLabel[r.type]||r.type)+'</td>'+
       commonCols.map(([k])=>cellHtml(r,k)).join('')+
       allTypeCols.map(([t,k])=>r.type===t?cellHtml(r,k):'<td></td>').join('')+
       '</tr>';
   }).join('')||'<tr><td colspan="'+(commonCols.length+allTypeCols.length+2)+'">該当する回答はありません。</td></tr>';
 }
}
['search','typeFilter','supportFilter'].forEach(id=>$(id).addEventListener('input',render));
$('csvBtn').onclick=()=>{const a=filtered();const keys=['reportedAt','facility','municipality','facilityType','type','reporter','phone','emisStatus','seismic','staffSafety','facilityDamage','careStatus','supportNeeded','safetyNote','building','buildingRisk','power','water','gas','comms','careEmergency','emergencyAccept','inpatientImpact','transferNeed','staffShort','supplyShort','emergencySupport','transportSupport','emergencyNote','detailDamage','flood','fire','gridPower','generator','fuelHours','detailWater','tank','fixedPhone','internet','outpatient','er','ward','surgery','icu','dialysis','delivery','homecare','pharmacy','oxygen','inpatients','transferCount','newAccept','criticalAccept','doctorShort','nurseShort','supplies','detailNote'];const e=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv='\ufeff'+keys.map(e).join(',')+'\n'+a.map(r=>keys.map(k=>e(r[k])).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),x=document.createElement('a');x.href=url;x.download='fukushima_medical_disaster_'+new Date().toISOString().slice(0,10)+'.csv';x.click();URL.revokeObjectURL(url)}
const editGroups={
basic:[['type','報告区分'],['reportedAt','報告時刻'],['facility','医療機関名'],['facilityType','医療機関区分'],['municipality','市町村'],['reporter','回答者氏名・役職'],['phone','連絡可能な電話番号'],['emisStatus','EMIS入力状況'],['seismic','震度']],
safety:[['staffSafety','職員の安否'],['facilityDamage','医療機関の被害'],['careStatus','診療状況'],['supportNeeded','支援要請'],['safetyNote','第1報・備考']],
emergency:[['building','建物・施設被害'],['buildingRisk','建物の危険状況'],['power','電気'],['water','水道'],['gas','医療ガス'],['comms','通信'],['careEmergency','現在の診療可否'],['emergencyAccept','救急患者受入'],['inpatientImpact','入院患者への影響'],['transferNeed','転院が必要な患者'],['staffShort','人員不足'],['supplyShort','医薬品・医療資機材不足'],['emergencySupport','支援要否'],['transportSupport','患者搬送支援'],['emergencyNote','必要な支援内容']],
detail:[['detailDamage','倒壊・損壊'],['flood','浸水'],['fire','火災'],['gridPower','商用電源'],['generator','非常用発電機'],['fuelHours','燃料残り時間（時間）'],['detailWater','上水'],['tank','受水槽'],['fixedPhone','固定電話'],['internet','インターネット'],['outpatient','外来'],['er','救急'],['ward','入院'],['surgery','手術'],['icu','ICU/HCU'],['dialysis','人工透析'],['delivery','分娩'],['homecare','在宅医療'],['pharmacy','処方・薬剤提供'],['oxygen','酸素・医療ガス供給'],['inpatients','現在の入院患者数'],['transferCount','転院必要患者数'],['newAccept','新規患者受入'],['criticalAccept','重症患者受入'],['doctorShort','医師不足'],['nurseShort','看護師不足'],['supplies','不足している医薬品・物資・資機材'],['detailNote','必要な支援内容・その他詳細']]
};
const longKeys=new Set(['safetyNote','emergencyNote','supplies','detailNote']);
let activeEditTab='basic';
let editingId=null;
let editingReport=null;
function renderEditTab(){
 const r=editingReport;if(!r)return;
 document.querySelectorAll('.edittab').forEach(b=>b.classList.toggle('active',b.dataset.editTab===activeEditTab));
 $('editFields').innerHTML=editGroups[activeEditTab].map(([k,label])=>'<div class="editfield"><label>'+esc(label)+'</label>'+(longKeys.has(k)?'<textarea data-key="'+k+'">'+esc(r[k]??'')+'</textarea>':'<input data-key="'+k+'" value="'+esc(r[k]??'')+'">')+'</div>').join('');
}
function saveVisibleEditFields(){
 if(!editingReport)return;
 $('editFields').querySelectorAll('[data-key]').forEach(el=>editingReport[el.dataset.key]=el.value);
}
function openEdit(id){
 const r=reports().find(x=>String(x.id)===String(id));if(!r)return;
 editingId=String(id);editingReport=structuredClone(r);activeEditTab='basic';$('editStatus').textContent='';
 document.querySelectorAll('.edittab').forEach(b=>{
   const tab=b.dataset.editTab;
   b.classList.toggle('hidden',tab!=='basic'&&tab!==r.type);
 });
 renderEditTab();$('editModal').classList.remove('hidden');
}
document.querySelectorAll('.edittab').forEach(b=>b.onclick=()=>{saveVisibleEditFields();activeEditTab=b.dataset.editTab;renderEditTab()});
function closeEdit(){$('editModal').classList.add('hidden');editingId=null;editingReport=null}
async function deleteReport(id){
 const r=reports().find(x=>String(x.id)===String(id));if(!r)return;
 const name=r.facility||'この回答';
 if(!confirm('「'+name+'」の回答データを消去します。\nこの操作は元に戻せません。よろしいですか？'))return;
 const {error}=await db.from('medical_reports').delete().eq('id',id);
 if(error){alert('消去できません：'+error.message);return}await loadReports();
}
$('editClose').onclick=closeEdit;$('editCancel').onclick=closeEdit;
$('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))closeEdit()});
$('editSave').onclick=async()=>{
 if(editingId===null)return;
 saveVisibleEditFields();
 const r=editingReport;
 const basicKeys=new Set(['id','type','facility','facilityType','municipality','reporter','phone','reportedAt','createdAt','updatedAt']);
 const payload={};Object.entries(r).forEach(([key,value])=>{if(!basicKeys.has(key))payload[key]=value});
 $('editSave').disabled=true;$('editStatus').textContent='保存しています…';
 const {error}=await db.from('medical_reports').update({report_type:r.type,facility:r.facility,facility_type:r.facilityType,municipality:r.municipality,reporter:r.reporter,phone:r.phone,reported_at:r.reportedAt||null,payload}).eq('id',editingId);
 $('editSave').disabled=false;
 if(error){$('editStatus').textContent='保存できません：'+error.message;$('editStatus').className='status bad';return}
 $('editStatus').textContent='変更を保存しました。';$('editStatus').className='status';await loadReports();setTimeout(closeEdit,500);
};

if(!db){setLoginStatus('app-config.js にSupabase接続設定が必要です。')}else db.auth.getSession().then(({data})=>{if(data.session)completeLogin();else setAuthView(false)});
</script></body></html>
